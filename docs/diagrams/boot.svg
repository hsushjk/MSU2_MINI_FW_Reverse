<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660">
<title>启动链</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="34" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#111">MSU2_MINI V1.1 启动链</text><rect x="30" y="56" width="300" height="62" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="40" y="77" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">上电复位</text><text x="40" y="98" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">rom:0x0000 → 向量表取 PC（mtvec = 7）</text><text x="40" y="115" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">异常向量地址 = 4 + 4n</text><rect x="30" y="148" width="300" height="118" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="40" y="169" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">crt0  _start  0x3BB4</text><text x="40" y="190" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">gp  = 0x20000880   sp = 0x20005000</text><text x="40" y="207" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">.data 0x5DF0 → 0x20000000（176 B）</text><text x="40" y="224" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">.bss  0x200000B0 → 0x200011AF（4352 B）</text><text x="40" y="241" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">写 mtvec / 开全局中断</text><rect x="30" y="296" width="300" height="96" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="40" y="317" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">SystemInit  0x3B32</text><text x="40" y="338" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">RCC-&gt;CTLR |= HSION</text><text x="40" y="355" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">FLASH-&gt;ACTLR = (x &amp; ~3) | 2</text><text x="40" y="372" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">RCC-&gt;CFGR0 &amp;= 0xF8FFFF0F  ⇒ 48 MHz</text><text x="40" y="389" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">不启用 PLL，无外部晶振</text><rect x="30" y="422" width="300" height="74" rx="4" fill="#eef3f9" stroke="#4a6f9c" stroke-width="1.2"/><text x="40" y="443" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">SystemCoreClockUpdate  0x3B74</text><text x="40" y="464" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">SystemCoreClock = 0x02DC6C00</text><text x="40" y="481" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">写入 RAM 0x20000080（48 000 000）</text><rect x="30" y="526" width="300" height="88" rx="4" fill="#fbf1f0" stroke="#a9524a" stroke-width="1.2"/><text x="40" y="547" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">跳转 main（不可见于调用流）</text><text x="40" y="568" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">lui t0, 0x4 ; csrw mepc, t0</text><text x="40" y="585" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">mret            → 0x39B4</text><text x="40" y="602" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">任何调用流分析都追不到此处</text><line x1="180" y1="118" x2="180" y2="148" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><line x1="180" y1="266" x2="180" y2="296" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><line x1="180" y1="392" x2="180" y2="422" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><line x1="180" y1="496" x2="180" y2="526" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><rect x="376" y="56" width="574" height="250" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="386" y="77" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">main  0x39B4 —— 初始化顺序</text><text x="386" y="98" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">__riscv_save_8 / write_once_flag(1) / SystemCoreClockUpdate / Delay_Init</text><text x="386" y="115" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">USART2_Init(0x1C200) → printf("SystemClk:%d") → GetChipID → printf("ChipID:%08x")</text><text x="386" y="132" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">board_clocks_enable / tim3_init / board_gpio_init</text><text x="386" y="149" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">pvd_probe → usb_device_init(1, 上拉检测)</text><text x="386" y="166" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">spi_dma_tx_init(CH3) / spi_dma_rx_init(CH2) / dma_ring_init(CH8)</text><text x="386" y="183" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">spi1_gpio_init / flash_uid→record / licence_check / spi1_gpio_init2</text><text x="386" y="200" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">adc_init / lcd_init / lcd_fill_colour(0,0,160,80,白)</text><text x="386" y="217" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">授权失败时叠三行提示文字（不影响任何功能）</text><text x="386" y="234" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">reset_session()</text><rect x="376" y="336" width="574" height="96" rx="4" fill="#eef3f9" stroke="#4a6f9c" stroke-width="1.2"/><text x="386" y="357" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">main_loop  0x59A</text><text x="386" y="378" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">每轮：取环内一帧 → cmd_dispatch → 组 6 字节响应 → EP3 IN</text><text x="386" y="395" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">TIM3 1 kHz tick：超过 5 秒无新帧 → reset_session</text><text x="386" y="412" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">class 4（批量像素）在此直接处理，不经过 cmd_dispatch</text><line x1="676" y1="306" x2="676" y2="336" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><path d="M 330 566 L 376 566 L 376 306" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><text x="382" y="560" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#5a5a5a">mret</text><text x="30" y="648" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b6b6b">说明：左侧为真实执行顺序；右侧为 main 内部的调用顺序，箭头仅表示先后，不表示所有调用都发生在同一层。</text>
</svg>
