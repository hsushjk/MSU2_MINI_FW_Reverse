<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="640" viewBox="0 0 1020 640">
<title>USB 数据通路</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="34" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#111">USB 数据通路</text><rect x="30" y="70" width="190" height="70" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="40" y="91" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">USB 主机</text><text x="40" y="112" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">CDC-ACM 或 HID</text><text x="40" y="129" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">64 字节包</text><rect x="280" y="70" width="230" height="70" rx="4" fill="#eef3f9" stroke="#4a6f9c" stroke-width="1.2"/><text x="290" y="91" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">EP2 OUT</text><text x="290" y="112" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">UEP2_DMA = 槽地址</text><text x="290" y="129" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">中断触发即搬运</text><rect x="570" y="56" width="240" height="104" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="580" y="77" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">端点缓冲  0x20000BE4</text><text x="580" y="98" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">16 个槽 × 64 字节</text><text x="580" y="115" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">槽索引 0–15，满后回卷</text><rect x="570" y="210" width="240" height="104" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="580" y="231" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">长度表  0x20000FEA + idx*2</text><text x="580" y="252" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">ISR 写入低/高字节</text><text x="580" y="269" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">生产者索引 0x20000FE4</text><rect x="280" y="210" width="230" height="104" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="290" y="231" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">环形队列  0x20000234</text><text x="290" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">144 字节 = 24 × 6 字节</text><text x="290" y="269" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">头/尾指针按 6 递增</text><rect x="30" y="210" width="190" height="104" rx="4" fill="#eef3f9" stroke="#4a6f9c" stroke-width="1.2"/><text x="40" y="231" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">main_loop 取帧</text><text x="40" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">按 6 字节步长前进</text><text x="40" y="269" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">组装 6 字节帧</text><rect x="30" y="380" width="190" height="70" rx="4" fill="#eef3f9" stroke="#4a6f9c" stroke-width="1.2"/><text x="40" y="401" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">cmd_dispatch</text><text x="40" y="422" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">按 class 分派</text><rect x="280" y="380" width="230" height="70" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="290" y="401" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">响应缓冲  0x200000C4</text><text x="290" y="422" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">固定 6 字节</text><rect x="570" y="380" width="240" height="70" rx="4" fill="#eef3f9" stroke="#4a6f9c" stroke-width="1.2"/><text x="580" y="401" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">EP3 IN</text><text x="580" y="422" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">usb_ep_send(3, buf, 6, 1)</text><rect x="870" y="380" width="120" height="70" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="880" y="401" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">USB 主机</text><text x="880" y="422" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a"></text><line x1="220" y1="105" x2="280" y2="105" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><line x1="510" y1="105" x2="570" y2="105" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><line x1="690" y1="160" x2="690" y2="210" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><line x1="570" y1="262" x2="510" y2="262" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><line x1="280" y1="262" x2="220" y2="262" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><line x1="125" y1="314" x2="125" y2="380" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><line x1="220" y1="415" x2="280" y2="415" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><line x1="510" y1="415" x2="570" y2="415" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><line x1="810" y1="415" x2="870" y2="415" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><rect x="30" y="490" width="460" height="130" rx="4" fill="#fbf1f0" stroke="#a9524a" stroke-width="1.2"/><text x="40" y="511" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">控制传输（EP0）</text><text x="40" y="532" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">SETUP 包 → usb_ep_reset / 描述符查询</text><text x="40" y="549" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">SET_REPORT 落到 class 0 分支：</text><text x="40" y="566" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">  目标地址 = 0x2000102C + 主机给出的 addr</text><text x="40" y="583" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">无长度、无地址边界校验 —— 可写穿 20 KB SRAM</text><rect x="520" y="490" width="470" height="130" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="530" y="511" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">中断与时钟</text><text x="530" y="532" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">USBFS_IRQHandler 0x1110：一次搬运一个槽</text><text x="530" y="549" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">搬运完成后才更新长度表与生产者索引</text><text x="530" y="566" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">主循环与 ISR 不共享锁：索引更新顺序即同步手段</text><text x="530" y="583" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">TIM3 1 kHz 仅用于 5 秒会话超时，不参与数据搬运</text><text x="30" y="636" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b6b6b">注：0x20000BE4 / 0x20000FE4 / 0x20000FEA / 0x20000234 由 gp 相对地址换算得出（gp = 0x20000880）。</text>
</svg>
