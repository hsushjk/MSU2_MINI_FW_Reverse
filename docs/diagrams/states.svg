<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470">
<title>状态机</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="34" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#111">main_loop 状态机</text><rect x="70" y="66" width="260" height="104" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="80" y="87" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">状态 0：空闲</text><text x="80" y="108" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">g_main_state = 0</text><text x="80" y="125" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">逐帧读取并分派</text><text x="80" y="142" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">等待握手帧</text><rect x="640" y="66" width="300" height="104" rx="4" fill="#eef3f9" stroke="#4a6f9c" stroke-width="1.2"/><text x="650" y="87" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">状态 1：流式</text><text x="650" y="108" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">g_main_state = 1</text><text x="650" y="125" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">受理 LCD 数据帧与批量像素</text><text x="650" y="142" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">握手后进入，超时后退回</text><line x1="330" y1="118" x2="640" y2="118" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><text x="396" y="108" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#5a5a5a">握手帧 00 4D 53 4E 43 4E</text><rect x="70" y="230" width="870" height="58" rx="4" fill="#fbf1f0" stroke="#a9524a" stroke-width="1.2"/><text x="80" y="251" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">每轮开头：会话超时判定</text><text x="80" y="272" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">g_tick 由 TIM3 每 1 ms 累加；与上次投递的差值 ≥ 4999（约 5 秒）即复位会话</text><line x1="200" y1="170" x2="200" y2="230" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><line x1="790" y1="170" x2="790" y2="230" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><rect x="70" y="344" width="260" height="86" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="80" y="365" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">reset_session  0x584</text><text x="80" y="386" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">g_tick = 0、清帧状态</text><text x="80" y="403" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">g_main_state = 0、清接收命令</text><line x1="200" y1="288" x2="200" y2="344" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><path d="M 330 387 L 40 387 L 40 118 L 70 118" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><text x="34" y="300" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#5a5a5a" transform="rotate(-90 34 300)">复位后回到空闲</text><rect x="640" y="344" width="300" height="86" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="650" y="365" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">未授权分支（仅显示）</text><text x="650" y="386" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">licence_check 0x1A86 返回 0 时</text><text x="650" y="403" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">开机叠三行提示，功能不受限</text><text x="70" y="456" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b6b6b">两个状态的切换点只有握手帧；其余命令不改变状态。超时判定在每轮循环开头执行，与当前状态无关。</text>
</svg>
