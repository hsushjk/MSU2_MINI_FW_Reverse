<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700">
<title>命令分派</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="34" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#111">命令分派结构</text><rect x="400" y="56" width="260" height="82" rx="4" fill="#eef3f9" stroke="#4a6f9c" stroke-width="1.2"/><text x="410" y="77" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">6 字节帧</text><text x="410" y="98" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">[class, sub, p2, p3, p4, p5]</text><text x="410" y="115" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">大端、无校验、无序号</text><rect x="400" y="178" width="260" height="58" rx="4" fill="#eef3f9" stroke="#4a6f9c" stroke-width="1.2"/><text x="410" y="199" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">cmd_dispatch  0x250</text><text x="410" y="220" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">按 class 分派</text><line x1="530" y1="138" x2="530" y2="178" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><rect x="20" y="300" width="156" height="132" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="30" y="321" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">class 0  系统</text><text x="30" y="342" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">0x4D  握手回显</text><text x="30" y="359" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">0x30  SFR 子操作：</text><text x="30" y="376" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">  查表 / 设滤波系数</text><text x="30" y="393" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">  写 0x20000140+addr</text><text x="30" y="410" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">  空操作</text><line x1="530" y1="236" x2="98" y2="300" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><rect x="236" y="300" width="156" height="132" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="246" y="321" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">class 2  LCD</text><text x="246" y="342" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">0  设置坐标</text><text x="246" y="359" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">1  设置尺寸</text><text x="246" y="376" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">2  设置颜色/页</text><text x="246" y="393" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">3  绘图操作码 0x00–0x0B</text><text x="246" y="410" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">4  设置填充单元</text><line x1="530" y1="236" x2="314" y2="300" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><rect x="452" y="300" width="156" height="132" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="462" y="321" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">class 3  Flash</text><text x="462" y="342" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">0  按 24 位地址读页</text><text x="462" y="359" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">1  写页</text><text x="462" y="376" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">2  擦除范围</text><text x="462" y="393" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">3  写页（第二实现）</text><line x1="530" y1="236" x2="530" y2="300" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><rect x="668" y="300" width="156" height="132" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="678" y="321" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">class 8  ADC</text><text x="678" y="342" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">p1 = 通道号</text><text x="678" y="359" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">9 = 触摸，15 = 心跳</text><text x="678" y="376" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">回包 [08, ch, ?, ?, hi, lo]</text><line x1="530" y1="236" x2="746" y2="300" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><rect x="884" y="300" width="156" height="132" rx="4" fill="#fbf1f0" stroke="#a9524a" stroke-width="1.2"/><text x="894" y="321" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">class 4  BULK</text><text x="894" y="342" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">不进 cmd_dispatch</text><text x="894" y="359" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">由 main_loop 直接处理</text><text x="894" y="376" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">tile[p1*4] = p2..p5</text><line x1="530" y1="236" x2="962" y2="300" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/><rect x="20" y="480" width="500" height="176" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.2"/><text x="30" y="501" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">class 2 / sub 3 的操作码（p2）</text><text x="30" y="522" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">0x00–0x06  内建绘图：纯色填充、贴图、单色图、混色图、横线</text><text x="30" y="539" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">0x07       装载绘图地址（上位机 DRAW_LOAD_ADDR）</text><text x="30" y="556" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">0x08       送出 len = (p3&lt;&lt;8)|p4 字节（DRAW_DATA）</text><text x="30" y="573" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">0x0A       设置显示方向并重新初始化屏（DRAW_DIRECTION）</text><text x="30" y="590" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">0x09       结束流式（固件内建，上位机未使用）</text><text x="30" y="607" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">0x0B       带底色贴图</text><rect x="540" y="480" width="500" height="176" rx="4" fill="#fbf1f0" stroke="#a9524a" stroke-width="1.2"/><text x="550" y="501" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1c1c1c">协议层缺陷（详见 ANALYSIS.md）</text><text x="550" y="522" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">len == 0 时按循环次数使用，导致永久等待</text><text x="550" y="539" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">擦除长度 16 位累加，P + N &gt; 0xFFFF 会回绕</text><text x="550" y="556" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">class 0 / sub 0x30 / 子操作 4 可写 0x20000140 + addr</text><text x="550" y="573" font-family="Consolas, Courier New, monospace" font-size="12" fill="#3a3a3a">SET_REPORT 控制传输同样落到该分支，无长度校验</text><text x="550" y="590" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3a3a3a">无重传与序号，丢掉一字节后全部帧错位</text><text x="20" y="686" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b6b6b">注：地址均为固件内地址；上位机侧的帧构造见 Open_MSU2_MINI/docs/PROTOCOL.md。</text>
</svg>
